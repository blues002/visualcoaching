name: 강의·워크숍 의뢰
description: 기관에서 들어온 강의 요청을 접수부터 정산까지 추적합니다
title: "[강의] 기관명 - 주제"
labels: ["강의·워크숍"]
body:
  - type: input
    id: org
    attributes:
      label: 기관 / 담당자 연락처
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 일시
      placeholder: 2026-11-12 (목) 10:00-12:00
  - type: input
    id: audience
    attributes:
      label: 대상과 인원
      placeholder: 어린이집 원장·교사 25명
  - type: input
    id: fee
    attributes:
      label: 강사료 (VAT 포함 여부)
  - type: textarea
    id: request
    attributes:
      label: 요청 내용
  - type: textarea
    id: checklist
    attributes:
      label: 진행 체크리스트
      value: |
        - [ ] 사전신청설문지 발송
        - [ ] 설문 응답 확인
        - [ ] 강의계획서 작성·발송
        - [ ] 구비서류 발송 (이력서, 강의계획서, 통장사본, 자격증 사본 등)
        - [ ] 강의자료 준비
        - [ ] 강의 진행
        - [ ] 만족도·후기 정리
        - [ ] 강사료 입금·세무 처리 확인
